<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrashGo - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
</head>
<body>
    <nav>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <img src="logo.jpeg" alt="TrashGo Logo" class="logo">
            <span style="background: rgba(139, 92, 246, 0.2); color: #c4b5fd; padding: 4px 12px; border-radius: 50px; font-size: 0.75rem; font-weight: 800; letter-spacing: 2px; border: 1px solid rgba(139, 92, 246, 0.4);">ADMIN</span>
        </div>
        <div id="nav-links" class="nav-actions">
            <span id="admin-name" style="font-weight: 700; color: var(--text-main);"></span>
            <button onclick="logout()" class="btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.85rem;">Logout</button>
        </div>
    </nav>

    <div class="container admin-container mb-5">
        <header class="text-center mt-5 mb-5">
            <h1 class="hero-title text-gradient-alt" style="font-size: 3.5rem; margin-bottom: 1rem;">Network<br>Oversight</h1>
            <p class="text-muted" style="font-size: 1.2rem;">Managing global restoration efforts 🌿</p>
        </header>

        <section id="heatmap-section" class="mb-5">
            <h2 class="text-gradient" style="font-size: 2.5rem;">Global Waste Hotspots</h2>
            <div id="heatmap-container" class="glass-panel" style="height: 400px; width: 100%; border-radius: 24px; overflow: hidden; margin-top: 1rem; position: relative; z-index: 1;"></div>
        </section>

        <div id="location-groups-container" style="display: flex; flex-direction: column; gap: 1.5rem;">
            <!-- Accordion items loaded dynamically -->
            <div style="text-align: center; color: var(--text-muted);">Grouping reports by 110m radius locations...</div>
        </div>
    </div>
    <footer class="site-footer">
        <p>© 2026 TrashGo  Built by Niraj</p>
        <div class="footer-links">
            <a href="https://www.linkedin.com/in/niraj-nandre" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a href="https://github.com/Neel7738" target="_blank" rel="noopener noreferrer">GitHub</a>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
