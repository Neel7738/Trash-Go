<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - TrashGo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card glass-panel">
            <header class="auth-header">
                <img src="logo.jpeg" alt="TrashGo Logo" class="logo mb-3" style="height: 80px;">
                <p class="text-muted" style="font-weight: 500;">Start Your Green Journey 🍃</p>
            </header>

            <form id="signup-form">
                <h2 class="text-center text-gradient mb-4">New Warrior Profile</h2>
                
                <div class="form-control">
                    <label class="form-label">Name</label>
                    <input type="text" id="name" class="form-input" placeholder="Earth Hero" required>
                </div>
                
                <div class="form-control">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="hero@earth.com" required>
                </div>
                
                <div class="form-control mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-primary mb-3">Join the Network</button>
                
                <p class="text-center text-muted mt-4" style="font-size: 0.9rem;">
                    Already a Warrior? <a href="login.html" class="auth-link text-gradient-alt">Login here</a>
                </p>
            </form>
        </div>
    </div>
    <footer class="site-footer">
        <p>© 2026 TrashGo  Built by Niraj</p>
        <div class="footer-links">
            <a href="https://www.linkedin.com/in/niraj-nandre" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a href="https://github.com/Neel7738" target="_blank" rel="noopener noreferrer">GitHub</a>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
